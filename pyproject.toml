[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"

[project]
name = "dynafrap_andreweuw"
version = "0.0.1"
authors = [
  { name="Ondrej Havlicek", email="ondrejhavlicek98@gmail.com" },
]
description = "Dynamic FRAP semiautomatic analysis tool"
readme = "README.md"
requires-python = ">=3.11,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "numpy",
    "pandas>=3.0.3",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.1",
    "tifffile>=2025.6.11",
    "vtk>=9.5.0",
    "biom3d==0.0.44",
    "torchio==0.20.5",
    "torch",
    "liffile>=2026.2.16",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]

[project.urls]
Homepage = "https://github.com/andreweuw/DynaFRAP"
Issues = "https://github.com/andreweuw/DynaFRAP/issues"

[project.scripts]
dynafrap-preprocess = "dynafrap_andreweuw.preprocessing.main:main"
dynafrap-segment = "dynafrap_andreweuw.segmentation.main:main"
dynafrap-measure = "dynafrap_andreweuw.measuring.main:main"
dynafrap-postprocess = "dynafrap_andreweuw.postprocessing.main:main"


[tool.ruff]
target-version = "py311"
line-length = 100
fix = true
unsafe-fixes = false
preview = false
show-fixes = true
respect-gitignore = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "W",     # pycodestyle warnings
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "SIM",   # flake8-simplify
  "RET",   # flake8-return
  "ARG",   # unused arguments
  "PIE",   # flake8-pie
  "PERF",  # performance anti-patterns
  "RUF",   # Ruff-specific rules
]

ignore = [
  "E501",   # handled by formatter where possible; long strings/comments are often intentional
  "B008",   # common in FastAPI/Typer dependency defaults
  "ARG002", # often annoying for interface/override methods
  "RUF012", # too noisy for class-level mutable annotations in many existing projects
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ARG001",
  "ARG002",
  "S101",
]
"__init__.py" = [
  "F401",
]
